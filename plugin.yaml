name: hermes-cited
version: 0.1.0
description: Cited in Hermes Agent. cited_search and cited_ask as native tools over POST <CITED_URL>/api/mcp, the /cited and /dot conversation modes, a deterministic verifier of the final answer and an auditable hash-chained log.
author: Katalis
license: Apache-2.0
homepage: https://github.com/RonnieGex/hermes-cited
kind: standalone
label: Cited
tags:
  - cited
  - citations
  - knowledge-base
  - audit
requires_env:
  - name: CITED_URL
    description: The address of the Cited installation, like https://cited.example.com. The plugin calls <CITED_URL>/api/mcp.
  - name: CITED_MCP_TOKEN
    description: The CITED_MCP_TOKEN of that installation. It travels only in the Authorization header.
    secret: true
optional_env:
  - name: CITED_TIMEOUT_MS
    description: How long one call to Cited may take, in milliseconds. 30000 by default.
  - name: CITED_DEFAULT_MODE
    description: The mode a conversation starts in, dot or cited. dot by default.
provides_tools:
  - cited_search
  - cited_ask
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
python_dependencies: []
