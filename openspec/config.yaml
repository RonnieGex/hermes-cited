schema: spec-driven
context: |
  hermes-cited is an Apache-2.0 native Hermes Agent plugin, written in Python.
  CITED_BRIDGE_TOOLS selects full (default) or search. Search registers only cited_search over /api/chassis/mcp
  with a profile-scoped CITED_SEARCH_TOKEN, no hooks, commands, skill or local writes. Configuration is read
  from the active profile: a non-mapping or unreadable scope fails closed at registration and at every call, a
  missing scope fails closed while the host multiplexes profiles, and on a Hermes 0.22 host that serves one
  profile and binds no scope (v0.22.4, commit 4d043038) the plugin reads the launch profile through the host's
  own owner_secret_scope builder; the plugin itself never reads the process environment while the agent
  package of Hermes is present.
  Every registered callback of full and its turn state belong to the profile that registered them: a call in
  another home or with a changed mode is refused before any effect, and the default mode, the language, the
  selected token and the audit path of a turn come from that profile and not from the process root.
  Live turns are keyed by that profile's canonical home together with the host session and turn identifiers, so
  identical identifiers in two profiles are two turns and a refused foreign callback performs no cleanup. The
  turn table's capacity is per profile: the oldest turn of the calling owner is evicted, never another
  profile's pending turn, and an explicit execution identifier that resolves to no open turn is refused
  instead of quoting a different live turn. The pinned host composes its turn identifier as
  session:task:suffix and its tool dispatch carries the task but not the turn, so both spellings resolve the
  same execution; a present turn_id is authoritative, creation, resolution and observation share the exact
  spelling, and an observation never fabricates or revives a turn. The
  persisted conversation mode uses the host's plain mode.profile key, which the host partitions per home: the
  plugin never prefixes it with a path or NUL and never hides a host key error. A failure diagnostic is redacted
  with the secret of the profile whose callback failed, tracebacks included. The disposable install runner
  provisions the pinned host's managed runtimes before closing the network and compares the whole profile
  inventory after setup with its baseline.
  H6 applies to both modes.
  Full-mode hermes_cited/ implements cited_search and cited_ask over the configured Cited POST /api/mcp endpoint,
  the /cited and /dot conversation modes, the deterministic cited-mode verifier and the hash-chained
  audit log at $HERMES_HOME/cited/audit.jsonl.
  The plugin is read-only against Cited: it never writes a document and never calls a language model itself.
  It must not be configured through MCP: the plugin needs to see every result for the verifier and the log.
  Repository prose, code, specifications and commits use English. README.es.md is a full translation.
  The Hermes installation under %LOCALAPPDATA%\hermes and the checkout hermes-agent are read-only:
  every run uses a temporary HERMES_HOME.
rules:
  proposal:
    - Cite the authorized scope and keep specification, implementation and review authors separate.
  specs:
    - Use explicit SHALL requirements and WHEN/THEN scenarios with no unresolved implementation choice.
  tasks:
    - Start with feature/<change>, then TDD, implementation, existing tests, unit and end-to-end checks, documentation.
    - Store executed command evidence under openspec/changes/<change>/reports/.
    - Close with verify, independent adversarial review, archive, then commit. Scan secrets before each commit.
