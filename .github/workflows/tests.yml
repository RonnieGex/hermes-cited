name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest and the Markdown consumer the suite checks
        run: python -m pip install --upgrade pip pytest markdown-it-py
      - name: Run the suite
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
